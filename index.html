<head>
    <title>MAX VO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png" />
    <link rel="shortcut icon" href="assets/favicon.png" />

        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        @font-face {

            font-weight: 700;

        }


        @font-face {
            font-family: nimbus-sans;
            src: url(https://use.typekit.net/af/da0c19/00000000000000000001518d/27/l?subset_id=2&fvd=n4&v=3) format("woff2"),
                url(https://use.typekit.net/af/da0c19/00000000000000000001518d/27/d?subset_id=2&fvd=n4&v=3) format("woff"),
                url(https://use.typekit.net/af/da0c19/00000000000000000001518d/27/a?subset_id=2&fvd=n4&v=3) format("opentype");

            src: url(https://use.typekit.net/af/7ba522/00000000000000000001011f/27/l?subset_id=2&fvd=i4&v=3) format("woff2"),
                url(https://use.typekit.net/af/7ba522/00000000000000000001011f/27/d?subset_id=2&fvd=i4&v=3) format("woff"),

            font-weight: 400;

        }

        @font-face {
            font-family: nimbus-sans;
            src: url(https://use.typekit.net/af/360cf4/000000000000000000012544/27/l?subset_id=2&fvd=n7&v=3) format("woff2"),
                url(https://use.typekit.net/af/360cf4/000000000000000000012544/27/d?subset_id=2&fvd=n7&v=3) format("woff"),
                url(https://use.typekit.net/af/360cf4/000000000000000000012544/27/a?subset_id=2&fvd=n7&v=3) format("opentype");
            font-weight: 700;

                url(https://use.typekit.net/af/a44ffc/000000000000000000010121/27/d?subset_id=2&fvd=i7&v=3) format("woff"),
                url(https://use.typekit.net/af/a44ffc/000000000000000000010121/27/a?subset_id=2&fvd=i7&v=3) format("opentype");
            font-weight: 700;

        }

        @font-face {

            src: url(https://use.typekit.net/af/50ea52/00000000000000000001011c/27/l?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n3&v=3) format("woff2"),
                url(https://use.typekit.net/af/50ea52/00000000000000000001011c/27/d?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n3&v=3) format("woff"),

            font-stretch: normal;
            font-display: auto;
        }

        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        :root {
            --w-sidebar: 80px;
        }

        html {
            scroll-behavior: smooth;
        }

        .nimbus {
            font-family: nimbus-sans, sans-serif;
            font-weight: 300;
        }

        .interstate {
            font-family: interstate, sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 1,
                'wght' 400,
                'GRAD' 0,
                'opsz' 48
        }

        .bg-highlight {
            background-image: linear-gradient(45deg, #cb0293 22%, #1433d8)
        }

        @keyframes fadeLoop {

            0%,
            100% {
                opacity: 0;
            }

            50% {
                opacity: 1;
            }
        }

        .fade-loop {
            animation: fadeLoop 1.5s ease-in-out infinite;
        }
    </style>
</head>

<body class="
text-lg md:text-base   leading-relaxed nimbus
bg-[#191919] w-full min-h-screen text-white/50  p-10  
">
    <!-- <div id="loader" class="fixed inset-0 flex items-center justify-center z-[50] bg-[#191919]">
        <img src="assets/logo.png" class="w-80 fade-loop" alt="Loading...">
    </div> -->
    <div id="resumeModal" class="
    transition-all duration-500   
    scale-0 invisible [&.active]:scale-100 [&.active]:visible
    fixed inset-0 z-[50] flex items-center justify-center bg-black/50 backdrop-blur-lg">
        <div class="relative w-[80%] lg:w-[60%] h-[90%] bg-white rounded-lg shadow-2xl overflow-hidden">
            <iframe id="pdfFrame" src="https://drive.google.com/file/d/1X3si1Y3VUOHavhrSm_O_XTxjRf5cfvdd/preview"
                class="w-full h-full border-0"></iframe>
        </div>
        <button id="btnCloseModal" aria-label="Close"
            class="absolute top-2 right-2 text-lg    text-white/30 rounded-full px-4  hover:text-white bg-white/10  transition-colors">
            Close
        </button>
    </div>

    <aside class="hidden lg:flex lg:fixed left-0 top-0 w-[var(--w-sidebar)] min-h-screen  ">
        <ul class="list-social flex flex-col gap-4 items-center m-auto mb-10   
            [&_li]:p-1  [&_li]:rounded-xl [&_li]:bg-white/10 hover:[&_li]:bg-white/20   [&_img]:w-12">
            <li><a href="#codemax"><img src="assets/codemax.png" alt=""></a></li>
            <li><a href="#starfish"><img src="assets/starfish.png" alt=""></a></li>
            <li><a href="#codinggpt"><img src="assets/codinggpt.png" alt=""></a></li>
            <li><a href="#dxc"><img src="assets/dxc.png" alt=""></a></li>
            <li><a href="#dailycoding"><img src="assets/plus.png" alt=""></a></li>
            <li><a href="mailto:maxvo.dev@gmail.com"><img src="assets/email.png" alt=""></a></li>
        </ul>
    </aside>
    <aside
        class="lg:fixed lg:w-[calc((100%-100px)*0.4)]   right-0 top-0 lg:p-2  lg:min-h-screen space-y-4 flex flex-col justify-center ">
        <img src="assets/logo.png" alt="NAME" class="w-60  object-cover mx-auto ">
        <input class="sr-only peer/design" type="radio" name="tab" id="design" checked>
        <input class="sr-only peer/projects" type="radio" name="tab" id="projects">
        <div class="interstate  text-lg text-white font-semibold  flex gap-2 *:justify-center  *:flex *:items-center *:gap-2 *:flex-1 *:p-1 
        [&_label]:rounded-2xl [&_label]:cursor-pointer 
        peer-checked/design:[&_.label-design]:bg-white/10 
        peer-checked/projects:[&_.label-projects]:bg-white/10 
        ">
            <label class="label-design" for="design">
                <img src="assets/about.svg" class="w-8" alt="Design">
                <span>About</span>
            </label>
            <label class="label-projects !hidden" for="projects">
                <img src="assets/stack.svg" class="w-8" alt="Project">
                <span>Project</span>
            </label>
        </div>
        <div class="grid [grid-template-areas:'stack']
        *:[grid-area:stack] *:transition-all *:duration-500  
        *:-translate-y-[1000px] overflow-hidden *:space-y-4 
        peer-checked/design:[&_.design]:-translate-y-0
        peer-checked/projects:[&_.projects]:-translate-y-0   ">
            <div class="design">
                <p class="!text-2xl" data-bind="aboutme">
                </p>
                <ul
                    class="list-social flex flex-row gap-4
                [&_a]:block [&_a]:p-4    [&_li]:rounded-2xl   [&_li]:bg-white/10 hover:[&_li]:bg-white/20   [&_img]:w-8  ">
                    <li><a href="https://www.linkedin.com/in/max-vo/" target="_blank"><img src="assets/linkedin.svg"
                                alt="Linkedin"></a></li>
                    <li><a href="https://github.com/mvocoding" target="_blank"><img src="assets/github.svg"
                                alt="Github"></a></li>
                    <li><a href="#" id="btnOpenModal"> <img src="assets/resume.svg" alt="Resume"> </a></li>
                    <li><a href="mailto:maxvo.dev@gmail.com"> <img src="assets/contact.svg" alt="Contact"> </a></li>
                </ul>
            </div>
            <div class="projects !hidden">
                <p class="text-lg" data-bind="stack">
                </p>
                <ul id="stackList" class="list-social flex flex-row gap-4
                [&_li]:p-1  [&_li]:rounded-xl [&_li]:bg-white/10 hover:[&_li]:bg-white/20   [&_img]:w-12">

                </ul>
            </div>
        </div>
    </aside>
    <main class="max-lg:mt-14  lg:ml-[var(--w-sidebar)] lg:w-[calc((100%-100px)*0.6)]   py-8  
    [&_.highlight]:font-[interstate] [&_.highlight]:text-white [&_.highlight]:font-bold  [&_h2]:text-3xl    space-y-14  
    ">
        <ul class="*:overflow-hidden   
        flex flex-col gap-14 
        text-xl   
        *:bg-white/10   *:flex max-md:*:flex-col  *:gap-4  *:items-center *:rounded-3xl *:p-5  [&_li_*]:flex-1 [&_.description]:space-y-4 
        [&_button]:flex [&_button]:ml-auto 

        sm:*:h-[450px]    [&_.media]:flex [&_.media]:justify-center 
        
        [&_button]:px-4 [&_button]:py-1 [&_button]:rounded-full [&_button]:bg-white/10 hover:[&_button]:bg-white/20 
        " id="project-wrapper">
        </ul>


        <div id="dailycoding"
            class="liveproject wrapper space-y-5 rounded-xl bg-white/10 p-5 ring-8 ring-black/5 border border-zinc-700/30 ">
            <h2 class="highlight">Daily Coding </h2>
        </div>
    </main>

    <template id="tplliveproject">
        <div
            class="liveproject-wrapper overflow-auto grid grid-cols-[repeat(auto-fit,minmax(250px,1fr))]   [grid-auto-rows:1fr] gap-3">
        </div>

        <div class="liveproject-item">
            <section class=" aspect-video relative overflow-hidden"><img src=""
                    class="image w-full h-full object-cover hover:scale-150 transition-all duration-[10s]"><button
                    type="button"
                    class="view-btn rounded-full bg-[#4B8EB0]/80  px-2 py-1   absolute bottom-0 right-0 text-xs text-white transition-all duration-300 hover:bg-black/50 ">Tap
                    to view</button></section>
            <section class="bg-[#1F242E] p-2 space-y-2"><button class="title highlight  font-semibold ">---</button>
        </div>
    </template>
    <template id="projectItemTpl">
        <li>
            <div class="media">
            </div>
            <div class="description">
                <h2 class="highlight" data-title>---
                </h2>
                <p data-desc>---
                </p>
                <button class="highlight" data-btn>---</button>
            </div>
        </li>
    </template>

    <template id="stackItemTpl">
        <li><a href="#"><img data-img src="" alt="---"></a></li>
    </template>

</body>
<script src="app.js"></script>

</html>
